name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy (non-blocking)
        run: mypy app || true
      - name: Bandit (security)
        run: bandit -r app -ll
      - name: Semgrep (OWASP/SAST)
        run: semgrep --config=p/python --config=p/owasp-top-ten --error app
      - name: pip-audit (deps)
        # All ignores below are transitive pins of semgrep (dev tooling only, NOT
        # shipped in the app) — the resolver cannot take the fixed versions while
        # semgrep pins them. Verified 2026-07-16 in python:3.11 (ResolutionImpossible).
        # Remove each block once semgrep relaxes the corresponding pin:
        #  - pyjwt 2.12.1 (semgrep pins pyjwt~=2.12.0): PYSEC-2026-175/177/178/179
        #  - mcp 1.23.3 (semgrep pins mcp==1.23.3; fixes in 1.27.2/1.28.1):
        #    CVE-2026-52869/52870/59950
        #  - click 8.1.8 (semgrep pins click~=8.1.8; fix in 8.3.3): PYSEC-2026-2132
        run: >-
          pip-audit -r requirements-dev.txt
          --ignore-vuln PYSEC-2026-175
          --ignore-vuln PYSEC-2026-177
          --ignore-vuln PYSEC-2026-178
          --ignore-vuln PYSEC-2026-179
          --ignore-vuln CVE-2026-52869
          --ignore-vuln CVE-2026-52870
          --ignore-vuln CVE-2026-59950
          --ignore-vuln PYSEC-2026-2132
      - name: Pytest (non-gui)
        run: pytest -m "not gui" -v

  gui-test-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Pytest (full incl. gui)
        run: pytest -v
